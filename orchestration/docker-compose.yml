# Orchestration-style Saga demo.
# Flow: client -> orchestrator-service -> (order, inventory, payment) via REST.
# Run:  docker compose up --build
services:

  zipkin:
    image: openzipkin/zipkin:3
    ports:
      - "9411:9411"   # UI + API at http://localhost:9411

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"   # host:container — 5433 avoids clashing with any local Postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 15

  order-service:
    build: ./order-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/orderdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

  payment-service:
    build: ./payment-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/paymentdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"

  inventory-service:
    build: ./inventory-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventorydb
      DB_USER: postgres
      DB_PASSWORD: postgres
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"

  orchestrator-service:
    build: ./orchestrator-service
    environment:
      ORDER_URL: http://order-service:8081
      PAYMENT_URL: http://payment-service:8082
      INVENTORY_URL: http://inventory-service:8083
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      - order-service
      - payment-service
      - inventory-service
    ports:
      - "8080:8080"

  auth-service:
    build: ./auth-service
    # RS256 keys are generated in-process; no shared secret needed.
    ports:
      - "8085:8085"

  api-gateway:
    build: ./api-gateway
    environment:
      AUTH_URL: http://auth-service:8085          # gateway fetches the RS256 public key here
      ORCHESTRATOR_URL: http://orchestrator-service:8080
      ORDER_URL: http://order-service:8081
      PAYMENT_URL: http://payment-service:8082
      INVENTORY_URL: http://inventory-service:8083
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      - orchestrator-service
      - auth-service
    ports:
      - "8000:8000"