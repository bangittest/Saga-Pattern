## Rancher Server chạy như một Deployment trên cụm k8s hiện có, ví dụ docker-desktop.
## Khi chạy trong Kubernetes Pod, Rancher sẽ chạy theo chế độ dùng API Server của cluster hiện tại.
## Vì vậy Rancher cần ServiceAccount có quyền cluster-admin.
##
## Apply:   kubectl apply -f rancher-server.yaml
## HTTP:    http://localhost:30800
## HTTPS:   https://localhost:30443   self-signed cert -> bấm bỏ qua cảnh báo
## Login:   user 'admin', mật khẩu bootstrap = admin12345  đổi sau khi vào
#---
#apiVersion: v1
#kind: Namespace
#metadata:
#  name: cattle-system
#
#---
#apiVersion: v1
#kind: ServiceAccount
#metadata:
#  name: rancher
#  namespace: cattle-system
#
#---
#apiVersion: rbac.authorization.k8s.io/v1
#kind: ClusterRoleBinding
#metadata:
#  name: rancher-cluster-admin
#roleRef:
#  apiGroup: rbac.authorization.k8s.io
#  kind: ClusterRole
#  name: cluster-admin
#subjects:
#  - kind: ServiceAccount
#    name: rancher
#    namespace: cattle-system
#
#---
