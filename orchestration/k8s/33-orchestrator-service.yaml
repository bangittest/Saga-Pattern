apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-service
  namespace: saga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator-service
  template:
    metadata:
      labels:
        app: orchestrator-service
    spec:
      containers:
        - name: orchestrator-service
          image: orchestration-orchestrator-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - { name: ORDER_URL, value: http://order-service:8081 }
            - { name: PAYMENT_URL, value: http://payment-service:8082 }
            - { name: INVENTORY_URL, value: http://inventory-service:8083 }
            - { name: ZIPKIN_ENDPOINT, value: http://zipkin:9411/api/v2/spans }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-service
  namespace: saga
spec:
  selector:
    app: orchestrator-service
  ports:
    - port: 8080
      targetPort: 8080
