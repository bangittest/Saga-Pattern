apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: saga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: orchestration-inventory-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
          env:
            - { name: DB_URL, value: jdbc:postgresql://postgres:5432/inventorydb }
            - { name: DB_USER, value: postgres }
            - { name: DB_PASSWORD, value: postgres }
            - { name: ZIPKIN_ENDPOINT, value: http://zipkin:9411/api/v2/spans }
          readinessProbe:
            tcpSocket: { port: 8083 }
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: saga
spec:
  selector:
    app: inventory-service
  ports:
    - port: 8083
      targetPort: 8083
