apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: saga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: orchestration-auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8085
          # RS256 keys are generated in-process; no env needed.
          readinessProbe:
            tcpSocket: { port: 8085 }
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: saga
spec:
  selector:
    app: auth-service
  ports:
    - port: 8085
      targetPort: 8085
