apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: saga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: orchestration-order-service:latest
          imagePullPolicy: Never          # reuse the locally-built compose image
          ports:
            - containerPort: 8081
          env:
            - { name: DB_URL, value: jdbc:postgresql://postgres:5432/orderdb }
            - { name: DB_USER, value: postgres }
            - { name: DB_PASSWORD, value: postgres }
            - { name: ZIPKIN_ENDPOINT, value: http://zipkin:9411/api/v2/spans }
          readinessProbe:
            tcpSocket: { port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: saga
spec:
  selector:
    app: order-service
  ports:
    - port: 8081
      targetPort: 8081
