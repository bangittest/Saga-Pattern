apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: saga
spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Không cho mất pod cũ khi pod mới chưa Ready
      maxUnavailable: 0

      # Cho tạo thêm 1 pod mới để test version mới
      maxSurge: 1

  # Pod mới phải Ready ít nhất 10s mới được coi là ổn
  minReadySeconds: 10

  # Sau 300s rollout chưa xong thì báo failed, nhưng không tự xóa pod lỗi
  progressDeadlineSeconds: 300

  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: orchestration-order-service:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8081

          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/orderdb
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              value: postgres
            - name: ZIPKIN_ENDPOINT
              value: http://zipkin:9411/api/v2/spans

          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: saga
spec:
  selector:
    app: order-service
  ports:
    - port: 8081
      targetPort: 8081
