apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: saga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: orchestration-api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - { name: AUTH_URL, value: http://auth-service:8085 }
            - { name: ORCHESTRATOR_URL, value: http://orchestrator-service:8080 }
            - { name: ORDER_URL, value: http://order-service:8081 }
            - { name: PAYMENT_URL, value: http://payment-service:8082 }
            - { name: INVENTORY_URL, value: http://inventory-service:8083 }
            - { name: ZIPKIN_ENDPOINT, value: http://zipkin:9411/api/v2/spans }
          readinessProbe:
            tcpSocket: { port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 5
---
#apiVersion: v1
#kind: Service
#metadata:
