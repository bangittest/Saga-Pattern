#spec:
#  type: NodePort
#  selector:
#    app: api-gateway
#  ports:
#    - port: 8000
#      targetPort: 8000
#      nodePort: 30080   # public entry: http://localhost:30080
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: saga
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 30080
      targetPort: 8000
