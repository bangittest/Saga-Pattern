services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jenkins
    restart: always
    user: root
    ports:
      - "9999:8080"
      - "50000:50000"
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./kube:/var/jenkins_home/.kube
      - ./kube:/root/.kube

volumes:
  jenkins-data: